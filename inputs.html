<!DOCTYPE html>

<body>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="Contact.html">Contact</a></li>
      <li><a href="inputs.html">Bericht sturen</a></li>
    </ul>
  </nav>

  <header class="contact-header">
    <h1>Stuur een bericht</h1>
  </header>

  <main class="container">
    <section>
      <h2>Contactformulier</h2>
      <form action="mailto:ajholtland@hotmail.com" method="post" enctype="text/plain">
        <div>
          <label for="name">Je naam</label>
          <input type="text" id="name" name="YourName" required>
        </div>
        <div>
          <label for="email">Je e-mailadres</label>
          <input type="email" id="email" name="YourEmail" required>
        </div>
        <div>
          <label for="message">Je bericht</label>
          <textarea id="message" name="YourMessage" rows="6"></textarea>
        </div>
        <input type="submit" value="Versturen">
      </form>
    </section>
  </main>

  <footer>
    &copy; 2026 Anne Jan Holtland
  </footer>
</body>

</html>
